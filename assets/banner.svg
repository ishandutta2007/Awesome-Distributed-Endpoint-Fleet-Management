<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.12)" />
    </pattern>

    <style>
      .beacon {
        animation: pulse 3s infinite ease-in-out;
      }
      .node-pulse {
        animation: radar 4s infinite linear;
      }
      .floating {
        animation: float 6s infinite ease-in-out;
      }
      .flowing-line {
        stroke-dasharray: 8 12;
        animation: dash 20s linear infinite;
      }
      .flowing-line-rev {
        stroke-dasharray: 6 10;
        animation: dash-rev 15s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes dash-rev {
        to { stroke-dashoffset: 400; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.95); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes radar {
        0% { r: 4; opacity: 1; }
        100% { r: 24; opacity: 0; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.3px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid-pattern)" rx="16" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="220" r="180" fill="#818cf8" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="380" r="130" fill="#c084fc" opacity="0.07" filter="url(#glow)" />

  <!-- Dynamic Distributed Telematics Constellation (Background Layer) -->
  <g opacity="0.65">
    <!-- Network Pathways -->
    <path class="flowing-line" d="M 80 320 Q 250 180, 480 280 T 880 200 T 1120 320" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />
    <path class="flowing-line-rev" d="M 120 120 Q 380 260, 680 140 T 1080 160" fill="none" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.5" />
    <path class="flowing-line" d="M 300 360 C 500 240, 750 360, 950 260" fill="none" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" />

    <!-- Animated Telematics Node 1 -->
    <g transform="translate(180, 240)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="1" class="node-pulse" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#soft-glow)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- Animated Telematics Node 2 -->
    <g transform="translate(480, 280)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#818cf8" stroke-width="1" class="node-pulse" style="animation-delay: -1.5s;" />
      <circle cx="0" cy="0" r="6" fill="#818cf8" filter="url(#soft-glow)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- Animated Telematics Node 3 -->
    <g transform="translate(880, 200)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#c084fc" stroke-width="1" class="node-pulse" style="animation-delay: -2.7s;" />
      <circle cx="0" cy="0" r="6" fill="#c084fc" filter="url(#soft-glow)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- Animated Telematics Node 4 -->
    <g transform="translate(1040, 300)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="1" class="node-pulse" style="animation-delay: -0.8s;" />
      <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#soft-glow)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- Animated Telematics Node 5 -->
    <g transform="translate(720, 150)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#34d399" stroke-width="1" class="node-pulse" style="animation-delay: -3.2s;" />
      <circle cx="0" cy="0" r="5" fill="#34d399" filter="url(#soft-glow)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header & Badges (Stays strictly crisp and legible) -->
  <g class="floating">
    <!-- Category Badge Tag -->
    <g transform="translate(415, 45)">
      <rect x="0" y="0" width="370" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" filter="url(#soft-glow)" />
      <circle cx="18" cy="16" r="4.5" fill="#38bdf8" />
      <text x="32" y="21" fill="#bae6fd" class="pill-text" font-size="12">DISTRIBUTED ENDPOINT TELEMATICS &amp; IOT</text>
    </g>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 135)">
    <text text-anchor="middle" fill="url(#text-grad)" class="title-text" font-size="42" filter="url(#soft-glow)">Distributed Endpoint Fleet Management</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 180)">
    <text text-anchor="middle" fill="#94a3b8" class="sub-text" font-size="19" letter-spacing="0.2">
      Curated Enterprise SaaS Telematics &amp; Open-Source GPS Vehicle Systems
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="380" y1="210" x2="820" y2="210" stroke="url(#primary-grad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Foreground Feature Pills -->
  <g transform="translate(130, 240)">
    <!-- Pill 1: GPS & Telematics -->
    <g transform="translate(0, 0)">
      <rect width="210" height="52" rx="12" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="24" y="32" fill="#e2e8f0" class="pill-text">📍 GPS Tracking</text>
    </g>

    <!-- Pill 2: AI Dash Cams & Video -->
    <g transform="translate(240, 0)">
      <rect width="220" height="52" rx="12" fill="url(#card-grad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <text x="24" y="32" fill="#e2e8f0" class="pill-text">📹 AI Video Telematics</text>
    </g>

    <!-- Pill 3: OBD-II & CAN Bus -->
    <g transform="translate(490, 0)">
      <rect width="220" height="52" rx="12" fill="url(#card-grad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <text x="24" y="32" fill="#e2e8f0" class="pill-text">🚗 CAN Bus / OBD-II</text>
    </g>

    <!-- Pill 4: Route Optimization -->
    <g transform="translate(740, 0)">
      <rect width="200" height="52" rx="12" fill="url(#card-grad)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
      <text x="24" y="32" fill="#e2e8f0" class="pill-text">⚡ Route Optimization</text>
    </g>
  </g>

  <!-- Bottom Metadata Row -->
  <g transform="translate(600, 350)">
    <text text-anchor="middle" fill="#64748b" class="sub-text" font-size="14">
      Real-Time Distributed Fleet Tracking • ELD / HOS Compliance • Autonomous AMR Dispatch • Self-Hosted Protocols
    </text>
  </g>
</svg>
